<!DOCTYPE html>
<html>
<body>

<video width="400" controls oncanplay="ready()">
    <source src="video.mp4" type="video/mp4">
</video>

<p id="m"></p>

<script>
function ready(){
    document.getElementById("m").innerHTML="Video Ready To Play";
}

window.onbeforeunload=function(){
    return "Form is not completed";
}
</script>

</body>
</html>
