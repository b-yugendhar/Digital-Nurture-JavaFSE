<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background-color:#cecdcd;
    color:#333;
}

header{
    background:linear-gradient(to right,#04317e,#00bcd4);
    color:white;
    text-align:center;
    padding:20px;
    border:0 0 10px rgba(0,0,0,0.2);
}

nav{
    margin-top:15px;
}

nav a{
    color:rgb(15, 13, 13);
    background:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
    padding:8px 12px;
    border-radius:5px;
}

nav a:hover{
    background:white;
    color:#0077cc;
}
    

section{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    margin-bottom:30px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    color:#2c3e50;
    margin-bottom:15px;
}

.card p{
    margin:10px 0;
    font-size:17px;
}

form{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

form h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#3498db;
    box-shadow:0 0 8px rgba(52,152,219,0.4);
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#3498db;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2980b9;
    transform:scale(1.02);
}

footer{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}

@media(max-width:768px){

    nav a{
        display:block;
        margin:10px 0;
    }

    section{
        width:95%;
    }

    form,
    .card{
        padding:20px;
    }
}
</style>
</head>
<body>

<header>
<h1>Contact Us</h1>

<nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="feedback.html">Feedback</a>
        <a href="contact.html">Contact</a>
        <a href="help.html">Help</a>
        <a href="preferences.html">Preferences</a>
</nav>

</header>

<section>

<div class="card">

<h2>Community Event Office</h2>

<p><strong>Email:</strong> communityportal@gmail.com</p>

<p><strong>Phone:</strong> +91 9876543210</p>

<p><strong>Address:</strong> Community Hall, Main Road, City Center</p>

</div>

<br>

<form>

<h2>Send Us a Message</h2>

<label>Name</label>
<input type="text" placeholder="Enter Name">

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Message</label>
<textarea rows="5" placeholder="Enter Message"></textarea>

<button type="submit">Send Message</button>

</form>

</section>

<footer>
<p>&copy; 2026 Community Event Portal</p>
</footer>

</body>
</html>
