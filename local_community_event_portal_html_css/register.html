<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Event</title>
</head>
<body>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background-color:#bbb7b7;
    color:#333;
    background-image:url('child.png');
    background-size:cover;
}

header{
    background:linear-gradient(to right,#04317e,#00bcd4);
    color:white;
    text-align:center;
    padding:20px;
    border:0 0 10px rgba(0,0,0,0.2);
}

nav{
    margin-top:15px;
}

nav a{
    color:rgb(15, 13, 13);
    background:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
    padding:8px 12px;
    border-radius:5px;
}

nav a:hover{
    background:white;
    color:#0077cc;
}

section{
    display:flex;
    justify-content:right;
    align-items:center;
    padding:40px 20px;
}

form{
    background:white;
    width:450px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

form h2{
    text-align:center;
    margin-bottom:25px;
    color:#2c3e50;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    transition:0.3s;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#3498db;
    box-shadow:0 0 8px rgba(52,152,219,0.4);
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2980b9;
    transform:translateY(-2px);
}

#result{
    display:block;
    text-align:center;
    color:green;
    font-weight:bold;
    margin-top:15px;
}

@media(max-width:500px){
    form{
        width:100%;
    }
}
</style>
<header>

<h1>Event Registration</h1>

<nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="feedback.html">Feedback</a>
        <a href="contact.html">Contact</a>
        <a href="help.html">Help</a>
        <a href="preferences.html">Preferences</a>
</nav>

</header>

<section>

<form id="eventForm">

<h2>Register Here</h2>

<label>Name</label>

<input
type="text"
placeholder="Enter Name"
required
autofocus>

<label>Email</label>

<input
type="email"
placeholder="Enter Email"
required>

<label>Date</label>

<input
type="date"
required>

<label>Event Type</label>

<select id="eventType">
<option>Music Event</option>
<option>Sports Event</option>
<option>Tech Workshop</option>
<option>Art Exhibition</option>
</select>

<label>Message</label>

<textarea
rows="5"
placeholder="Enter Message">
</textarea>

<button
type="button"
onclick="registerUser()">
Register
</button>

<br><br>

<output id="result"></output>

</form>

</section>
</body>
</html>
