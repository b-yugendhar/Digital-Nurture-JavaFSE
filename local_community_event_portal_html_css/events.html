<style>
 
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background-color:#cecdcd;
    color:#333;
}

header{
    background:linear-gradient(to right,#04317e,#00bcd4);
    color:white;
    text-align:center;
    padding:20px;
    border:0 0 10px rgba(0,0,0,0.2);
}

nav{
    margin-top:15px;
}

nav a{
    color:rgb(15, 13, 13);
    background:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
    padding:8px 12px;
    border-radius:5px;
}

nav a:hover{
    background:white;
    color:#0077cc;
}
    
   
section h2{
    text-align:center;
    color:#0077cc;
    margin:20px 0;
    font-size:32px;
}
table{
    margin:auto;
    border-collapse:collapse;
}
td{
    padding:20px;
    text-align:center;
}

.gallery{
    width:250px;
    height:170px;
    border:4px solid #010a10;
    border-radius:12px;
    transition:0.4s;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.gallery:hover{
    transform:scale(1.08);
    border-color:#919696;
}

td p{
    margin-top:10px;
    font-weight:bold;
    color:#333;
    font-size:18px;
}

section{
    width:95%;
    margin:auto;
    padding:20px;
}

.eventCard{
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 0 10px rgba(183, 168, 168, 0.15);
}

.eventCard h3{
    color:#0077cc;
    margin-bottom:10px;
}
</style></head>
