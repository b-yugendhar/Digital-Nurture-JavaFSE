<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Preferences</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background-color:#cecdcd;
    color:#333;
}

header{
    background:linear-gradient(to right,#04317e,#00bcd4);
    color:white;
    text-align:center;
    padding:20px;
    border:0 0 10px rgba(0,0,0,0.2);
}

nav{
    margin-top:15px;
}

nav a{
    color:rgb(15, 13, 13);
    background:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
    padding:8px 12px;
    border-radius:5px;
}

nav a:hover{
    background:white;
    color:#0077cc;
}
  

section{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px 20px;
}

.card{
    background:white;
    width:450px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    color:#2563eb;
    margin-bottom:25px;
}

/* Dropdown */
select{
    width:100%;
    padding:12px;
    border:2px solid #66a6ff;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

select:focus{
    border-color:#2563eb;
    box-shadow:0 0 10px rgba(37,99,235,0.3);
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
    color:white;
    font-size:16px;
    transition:0.3s;
}

button:first-of-type{
    background:#2563eb;
}

button:last-of-type{
    background:#ef4444;
}

button:hover{
    transform:scale(1.05);
}


#savedMessage{
    margin-top:20px;
    font-weight:bold;
    color:green;
    font-size:18px;
}


@media(max-width:768px){

    nav a{
        display:block;
        margin:10px 0;
    }

    .card{
        width:100%;
    }

    button{
        width:100%;
    }
}
</style>
</head>
<body>

<header>
<h1>Save Event Preferences</h1>

<nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="feedback.html">Feedback</a>
        <a href="contact.html">Contact</a>
        <a href="help.html">Help</a>
        <a href="preferences.html">Preferences</a>
</nav>
</header>

<section>

<div class="card">

<h2>Select Favorite Event</h2>

<select id="favoriteEvent">
<option value="">Choose Event</option>
<option value="Music Festival">Music Festival</option>
<option value="Sports Meet">Sports Meet</option>
<option value="Tech Workshop">Tech Workshop</option>
<option value="Art Exhibition">Art Exhibition</option>
</select>

<br><br>

<button onclick="savePreference()">
Save Preference
</button>

<button onclick="clearPreferences()">
Clear Preferences
</button>

<p id="savedMessage"></p>

</div>

</section>
</body>
</html>
